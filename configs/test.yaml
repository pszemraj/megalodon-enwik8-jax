# Quick test configuration for both models
# Usage: python train.py --config configs/test.yaml
run_dir: runs/test
model: llama  # or "megalodon"

# Model architecture (Llama config - small for testing)
num_tokens: 256  # vocab size (enwik8 bytes)
dim: 128
depth: 2
heads: 4
dim_head: 32
share_emb: false
ffn_hidden_dim: 341  # shared by both model options

# Megalodon-specific (used when model: megalodon)
model_dim: 128
num_layers: 2
num_heads: 2
z_dim: 64
value_dim: 128
cema_ndim: 4
chunk_size: 128
norm_num_groups: 16

# Precision policy
param_dtype: fp32
compute_dtype: bf16
accum_dtype: fp32
attention_softmax_dtype: fp32
loss_softmax_dtype: fp32
jit: true

# Training schedule
num_batches: 10
batch_size: 2
grad_accum_every: 2
learning_rate: 0.001
weight_decay: 0.0
grad_clip_norm: 1.0

# Data
data_path: data/enwik8.gz
seq_len: 128

# Evaluation
validate_every: 5
val_batches: 5
seed: 7
